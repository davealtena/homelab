---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: phobos-apps
  namespace: flux-system
spec:
  interval: 30m
  timeout: 5m
  retryInterval: 1m
  path: ./kubernetes/apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substitute:
      CLUSTER_DOMAIN: altena.io
      NFS_SERVER_ADDRESS: 192.168.1.200
      NFS_SERVER_PATH: /volume1/k8s
  patches:
    - # Propagate cluster-wide substitutions to every child Kustomization (a ConfigMap
      # can't be read across namespaces now that each Kustomization lives in its app namespace)
      patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: not-used
        spec:
          postBuild:
            substitute:
              CLUSTER_DOMAIN: altena.io
              NFS_SERVER_ADDRESS: 192.168.1.200
              NFS_SERVER_PATH: /volume1/k8s
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        labelSelector: substitution.flux.home.arpa/disabled notin (true)
