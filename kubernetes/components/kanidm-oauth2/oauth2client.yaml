---
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: ${APP}
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  displayname: ${OAUTH2_DISPLAYNAME}
  origin: https://${OAUTH2_HOST}.${CLUSTER_DOMAIN}
  redirectUrl:
    - https://${OAUTH2_HOST}.${CLUSTER_DOMAIN}${OAUTH2_REDIRECT_PATH}
  scopeMap:
    - group: ${OAUTH2_GROUP}
      scopes:
        - openid
        - email
        - profile
