---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app jellyseerr
spec:
  targetNamespace: media
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur/policy
  path: ./kubernetes/apps/media/jellyseerr/app
  prune: true
  postBuild:
    substitute:
      APP: jellyseerr
      KOPIUR_CLAIM: jellyseerr
      KOPIUR_CAPACITY: 15Gi
      KOPIUR_MOVER_UID: "1000"
      KOPIUR_MOVER_GID: "1000"
  dependsOn:
    - name: kopiur-repository
      namespace: system
    - name: jellyfin
      namespace: media
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
