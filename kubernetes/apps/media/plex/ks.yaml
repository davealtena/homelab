---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app plex
spec:
  targetNamespace: media
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur/policy
  path: ./kubernetes/apps/media/plex/app
  prune: true
  postBuild:
    substitute:
      APP: plex
      KOPIUR_CLAIM: plex-config
      KOPIUR_CAPACITY: 15Gi
      KOPIUR_IGNORE: "/Library/Application Support/Plex Media Server/Cache"
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: kopiur-repository
      namespace: system
