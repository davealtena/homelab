---
# Interim until kopiur (ADR-0002): plex-config lives on single-disk NVMe, so
# tar it nightly to the Synology NFS PVC. Plex's own scheduled task writes
# consistent SQLite copies (*.db-YYYY-MM-DD) that ride along in the archive.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: plex-backup
spec:
  schedule: "45 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          containers:
            - name: tar
              image: docker.io/library/alpine:3.22.2
              env:
                - name: RETENTION_DAYS
                  value: "14"
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  ts="$$(date +%Y-%m-%d_%H%M%S)"
                  out="/backup/plex-config_$${ts}.tar.gz"
                  echo "==> Archiving /config to $${out}"
                  tar -C /config --exclude='./Library/Application Support/Plex Media Server/Cache' \
                    --exclude='./Library/Application Support/Plex Media Server/Logs' \
                    -czf "$${out}" .
                  ls -lh "$${out}"
                  echo "==> Pruning archives older than $${RETENTION_DAYS} days"
                  find /backup -maxdepth 1 -name 'plex-config_*.tar.gz' -mtime "+$${RETENTION_DAYS}" -print -delete
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: backup
                  mountPath: /backup
          volumes:
            - name: config
              persistentVolumeClaim:
                claimName: plex-config
            - name: backup
              persistentVolumeClaim:
                claimName: plex-backup
