---
# Interim until kopiur (ADR-0002): jellyfin config lives on single-disk NVMe,
# so tar it nightly to the Synology NFS PVC (hot copy of the SQLite DB).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: jellyfin-backup
spec:
  schedule: "15 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          containers:
            - name: tar
              image: docker.io/library/alpine:3.24.3
              env:
                - name: RETENTION_DAYS
                  value: "14"
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  ts="$$(date +%Y-%m-%d_%H%M%S)"
                  out="/backup/jellyfin-config_$${ts}.tar.gz"
                  echo "==> Archiving /config to $${out}"
                  tar -C /config --exclude=./transcodes --exclude=./data/transcodes \
                    --exclude=./log \
                    -czf "$${out}" .
                  ls -lh "$${out}"
                  echo "==> Pruning archives older than $${RETENTION_DAYS} days"
                  find /backup -maxdepth 1 -name 'jellyfin-config_*.tar.gz' -mtime "+$${RETENTION_DAYS}" -print -delete
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: backup
                  mountPath: /backup
          volumes:
            - name: config
              persistentVolumeClaim:
                claimName: jellyfin
            - name: backup
              persistentVolumeClaim:
                claimName: jellyfin-backup
