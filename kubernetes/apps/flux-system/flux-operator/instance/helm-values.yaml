---
instance:
  distribution:
    # renovate: datasource=github-releases depName=fluxcd/flux2
    version: 2.9.6
  cluster:
    networkPolicy: false
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
  # Forgejo is the source of truth; the repo is public so Flux pulls in-cluster
  # without credentials. GitHub (https://github.com/davealtena/homelab) is a
  # push-mirror: point sync.url there when rebuilding a cluster that has no
  # Forgejo yet.
  sync:
    kind: GitRepository
    url: http://forgejo-http.selfhosted.svc.cluster.local:3000/dave/homelab.git
    ref: refs/heads/main
    path: kubernetes/flux
  kustomize:
    patches:
      # Modest worker counts for a single node.
      - patch: |
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --concurrent=4
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --requeue-dependency=5s
        target:
          kind: Deployment
          name: (kustomize-controller|helm-controller|source-controller)
