---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/notification.toolkit.fluxcd.io/provider_v1beta3.json
# Flux events are pushed into Alertmanager so they ride the existing
# Alertmanager -> Pushover route: one notification pipeline, one set of
# silences, same inhibition rules.
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: alertmanager
spec:
  type: alertmanager
  address: http://alertmanager-operated.observability.svc.cluster.local:9093/api/v2/alerts/
