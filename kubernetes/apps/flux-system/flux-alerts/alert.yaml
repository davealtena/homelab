---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/notification.toolkit.fluxcd.io/alert_v1beta3.json
# One cluster-wide Alert. Flux Kustomizations all live in flux-system; the
# HelmReleases/OCIRepositories live in their app namespace, so every namespace
# under kubernetes/apps is listed explicitly (cross-namespace refs are allowed:
# notification-controller runs without --no-cross-namespace-refs).
# New namespace -> add it here (the add-app skill mentions this).
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: alertmanager
spec:
  providerRef:
    name: alertmanager
  eventSeverity: error
  eventSources:
    - kind: FluxInstance
      name: "*"
    - kind: GitRepository
      name: "*"
    - kind: Kustomization
      name: "*"
    - kind: HelmRelease
      name: "*"
      namespace: ai
    - kind: OCIRepository
      name: "*"
      namespace: ai
    - kind: HelmRelease
      name: "*"
      namespace: cert-manager
    - kind: OCIRepository
      name: "*"
      namespace: cert-manager
    - kind: HelmRelease
      name: "*"
      namespace: databases
    - kind: OCIRepository
      name: "*"
      namespace: databases
    - kind: HelmRelease
      name: "*"
      namespace: downloads
    - kind: OCIRepository
      name: "*"
      namespace: downloads
    - kind: HelmRelease
      name: "*"
      namespace: flux-system
    - kind: OCIRepository
      name: "*"
      namespace: flux-system
    - kind: HelmRelease
      name: "*"
      namespace: home-automation
    - kind: OCIRepository
      name: "*"
      namespace: home-automation
    - kind: HelmRelease
      name: "*"
      namespace: kube-system
    - kind: OCIRepository
      name: "*"
      namespace: kube-system
    - kind: HelmRelease
      name: "*"
      namespace: media
    - kind: OCIRepository
      name: "*"
      namespace: media
    - kind: HelmRelease
      name: "*"
      namespace: network
    - kind: OCIRepository
      name: "*"
      namespace: network
    - kind: HelmRelease
      name: "*"
      namespace: observability
    - kind: OCIRepository
      name: "*"
      namespace: observability
    - kind: HelmRelease
      name: "*"
      namespace: openebs-system
    - kind: OCIRepository
      name: "*"
      namespace: openebs-system
    - kind: HelmRelease
      name: "*"
      namespace: security
    - kind: OCIRepository
      name: "*"
      namespace: security
    - kind: HelmRelease
      name: "*"
      namespace: selfhosted
    - kind: OCIRepository
      name: "*"
      namespace: selfhosted
  exclusionList:
    # transient network noise, retried by Flux anyway
    - error.*lookup.*github
    - dial.*tcp.*timeout
    - waiting.*socket
  suspend: false
