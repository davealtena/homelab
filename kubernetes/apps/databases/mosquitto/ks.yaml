---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app mosquitto
spec:
  targetNamespace: databases
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur/policy
  path: ./kubernetes/apps/databases/mosquitto/app
  prune: true
  postBuild:
    substitute:
      APP: mosquitto
      KOPIUR_CLAIM: mosquitto-config
      KOPIUR_CAPACITY: 1Gi
      KOPIUR_MOVER_UID: "1000"
      KOPIUR_MOVER_GID: "1000"
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: kopiur-repository
      namespace: system
