---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/batch/job_v1.json
# Idempotent DB/role provisioning (operator Deployment has no init container).
apiVersion: batch/v1
kind: Job
metadata:
  name: litellm-init-db
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: init-db
          image: ghcr.io/onedr0p/postgres-init:17.4
          envFrom:
            - secretRef:
                name: litellm
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
