---
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: garmin-mcp
spec:
  # Garmin's official Personal API (read-only, revocable key) instead of a
  # password login through the unofficial garminconnect library.
  image: ghcr.io/mason-levyy/garmin-personal-mcp:0.3.0
  transport: stdio
  proxyMode: streamable-http
  proxyPort: 8080
  env:
    # tools that default to "today" use the container's date
    - name: TZ
      value: Europe/Amsterdam
  secrets:
    - name: toolhive-garmin
      key: GARMIN_PERSONAL_API_KEY
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          volumeMounts:
            # read-only root filesystem: bearer-token cache and activity downloads live here
            - name: home
              mountPath: /home/garmin
      volumes:
        - name: home
          emptyDir: {}
  groupRef:
    name: mcp-tools
