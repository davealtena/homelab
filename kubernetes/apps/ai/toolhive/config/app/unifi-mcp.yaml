---
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: unifi-network-mcp
spec:
  # Run the published stdio server via uvx (the Docker image serves HTTP and
  # trips the MCP SDK's Host-header/DNS-rebinding check behind ToolHive's proxy).
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  transport: stdio
  proxyMode: streamable-http
  proxyPort: 8080
  env:
    - name: HOME
      value: /tmp
    - name: UV_CACHE_DIR
      value: /tmp/.uv-cache
    - name: UNIFI_HOST
      value: "192.168.1.1"
    - name: UNIFI_PORT
      value: "443"
    - name: UNIFI_SITE
      value: default
    - name: UNIFI_VERIFY_SSL
      value: "false"
  secrets:
    - name: toolhive-unifi-username
      key: UNIFI_USERNAME
    - name: toolhive-unifi-password
      key: UNIFI_PASSWORD
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 768Mi
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
          command:
            - /bin/sh
          args:
            - -c
            - uvx unifi-network-mcp@0.25.1
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  groupRef:
    name: mcp-tools
