---
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: kubesearch-mcp
spec:
  # Searches the kubesearch.dev index (HelmReleases/charts/images across public home-ops
  # repos) and can clone + grep indexed repos: "how do others deploy X" for the GitOps profile.
  image: ghcr.io/perfectra1n/kubesearch-mcp:1.3.0
  transport: streamable-http
  proxyMode: streamable-http
  proxyPort: 8080
  mcpPort: 3000
  env:
    - name: KUBESEARCH_POOL_SIZE
      value: "4"
    - name: KUBESEARCH_POOL_REPOS
      value: onedr0p/home-ops,bjw-s-labs/home-ops,buroa/home-ops,joryirving/home-ops
    - name: KUBESEARCH_CLONE_MAX_REPOS
      value: "6"
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 4Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 1Gi
  groupRef:
    name: mcp-tools
