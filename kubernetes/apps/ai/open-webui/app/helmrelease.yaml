---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  chartRef:
    kind: OCIRepository
    name: open-webui
  interval: 30m
  values:
    controllers:
      open-webui:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.11.1
            env:
              # Models come exclusively from the litellm gateway.
              ENABLE_OLLAMA_API: false
              ENABLE_OPENAI_API: true
              OPENAI_API_BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1
              WEBUI_URL: https://chat.${CLUSTER_DOMAIN}
              MEMINI_BASE_URL: http://memini.ai.svc.cluster.local:8080
              ENABLE_SIGNUP: true
              # SSO via Kanidm (OIDC); client id/secret from the KanidmOAuth2Client secret.
              ENABLE_OAUTH_SIGNUP: true
              OAUTH_MERGE_ACCOUNTS_BY_EMAIL: true
              OAUTH_PROVIDER_NAME: Kanidm
              OAUTH_SCOPES: openid email profile
              OAUTH_CODE_CHALLENGE_METHOD: S256
              OPENID_PROVIDER_URL: https://idm.${CLUSTER_DOMAIN}/oauth2/openid/open-webui/.well-known/openid-configuration
              OPENID_REDIRECT_URI: https://chat.${CLUSTER_DOMAIN}/oauth/oidc/callback
              OAUTH_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: open-webui-kanidm-oauth2-credentials
                    key: CLIENT_ID
              OAUTH_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: open-webui-kanidm-oauth2-credentials
                    key: CLIENT_SECRET
              # Native MCP tool server pointed at the ToolHive VMCP (seeds DB on first boot).
              TOOL_SERVER_CONNECTIONS: >-
                [{"type":"mcp","url":"http://vmcp-mcp-gateway-internal.ai.svc.cluster.local:4483/mcp","path":"","auth_type":"none","config":{"enable":true},"info":{"id":"toolhive-vmcp","name":"ToolHive VMCP","description":"garmin, home-assistant, unifi, kubectl, github"}}]
            envFrom:
              - secretRef:
                  name: open-webui
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 2Gi

    persistence:
      config:
        existingClaim: open-webui
        globalMounts:
          - path: /app/backend/data

    route:
      app:
        hostnames:
          - chat.${CLUSTER_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 8080

    service:
      app:
        ports:
          http:
            port: 8080
