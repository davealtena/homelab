---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: open-webui
    creationPolicy: Owner
  data:
    # OpenAI-compatible backend = the litellm gateway (master key).
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: litellm
        property: master_key
    # Consumed by the memini memory filter function (Admin -> Functions).
    - secretKey: MEMINI_API_KEY
      remoteRef:
        key: memini
        property: api_key
