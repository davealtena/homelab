---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app memini
spec:
  targetNamespace: ai
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: kopiur-repository
      namespace: system
    - name: external-secrets-stores
      namespace: security
    - name: litellm
      namespace: ai
    - name: ollama
      namespace: ai
  components:
    - ../../../../components/kopiur/backup
  path: ./kubernetes/apps/ai/memini/app
  prune: true
  postBuild:
    substitute:
      APP: memini
      KOPIUR_CLAIM: memini
      KOPIUR_CAPACITY: 5Gi
      KOPIUR_MOVER_UID: "1000"
      KOPIUR_MOVER_GID: "1000"
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 10m
