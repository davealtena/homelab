---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: hermes
    creationPolicy: Owner
    template:
      data:
        # gateway api_server auth (hermes <-> webui)
        API_SERVER_KEY: "{{ .api_server_key }}"
        # webui login (no OIDC: webui refuses issuers that resolve to private IPs, and idm.* is VPN-only)
        HERMES_WEBUI_PASSWORD: "{{ .webui_password }}"
        # Forgejo bot user `agent`, written to ~/.git-credentials by seed.sh
        FORGEJO_TOKEN: "{{ .forgejo_token }}"
  dataFrom:
    - extract:
        key: hermes
