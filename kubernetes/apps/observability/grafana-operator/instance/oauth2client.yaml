---
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: grafana
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  displayname: Grafana
  origin: https://grafana.${CLUSTER_DOMAIN}
  redirectUrl:
    - https://grafana.${CLUSTER_DOMAIN}/login/generic_oauth
  scopeMap:
    - group: grafana-users
      scopes:
        - openid
        - email
        - profile
        - groups
  claimMap:
    - name: grafana_role
      joinStrategy: array
      valuesMap:
        - group: grafana-admins
          values:
            - Admin
