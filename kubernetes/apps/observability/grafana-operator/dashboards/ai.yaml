---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: litellm
spec:
  folder: AI
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  url: https://raw.githubusercontent.com/BerriAI/litellm/main/cookbook/litellm_proxy_server/grafana_dashboard/dashboard_v2/grafana_dashboard.json
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: Prometheus
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: ai-inference
spec:
  folder: AI
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: Prometheus
  json: |
    {
      "title": "AI Inference",
      "uid": "ai-inference",
      "tags": [
        "ai",
        "gpu",
        "litellm",
        "ollama"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "GPU (RTX 5060 Ti)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "GPU utilisation",
          "datasource": {
            "type": "prometheus",
            "uid": "$${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 6,
            "h": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "max": 100,
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$${DS_PROMETHEUS}"
              },
              "expr": "DCGM_FI_DEV_GPU_UTIL",
              "legendFormat": "util",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "VRAM used",
          "datasource": {
            "type": "prometheus",
            "uid": "$${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 6,
            "y": 1,
            "w": 6,
            "h": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "decmbytes",
              "max": 16311,
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$${DS_PROMETHEUS}"
              },
              "expr": "DCGM_FI_DEV_FB_USED",
              "legendFormat": "used",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "GPU temperature",
          "datasource": {
            "type": "prometheus",
            "uid": "$${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 6,
            "h": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "celsius"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$${DS_PROMETHEUS}"
              },
              "expr": "DCGM_FI_DEV_GPU_TEMP",
              "legendFormat": "gpu",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$${DS_PROMETHEUS}"
              },
              "expr": "DCGM_FI_DEV_MEMORY_TEMP",
              "legendFormat": "mem",
              "refId": "B"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Power",
          "datasource": {
            "type": "prometheus",
            "uid": "$${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 18,
            "y": 1,
            "w": 6,
            "h": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$${DS_PROMETHEUS}"
              },
              "expr": "DCGM_FI_DEV_POWER_USAGE",
              "legendFormat": "W",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "GPU utilisation / memory copy",
          "datasource": {
            "type": "prometheus",
            "uid": "$${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "max": 100,
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$${DS_PROMETHEUS}"
              },
              "expr": "DCGM_FI_DEV_GPU_UTIL",
              "legendFormat": "sm util",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$${DS_PROMETHEUS}"
              },
              "expr": "DCGM_FI_DEV_MEM_COPY_UTIL",
              "legendFormat": "mem copy",
              "refId": "B"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "VRAM used vs free",
          "datasource": {
            "type": "prometheus",
            "uid": "$${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 8,
            "y": 6,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "decmbytes"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$${DS_PROMETHEUS}"
              },
              "expr": "DCGM_FI_DEV_FB_USED",
              "legendFormat": "used",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$${DS_PROMETHEUS}"
              },
              "expr": "DCGM_FI_DEV_FB_FREE",
              "legendFormat": "free",
              "refId": "B"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Temperature and power",
          "datasource": {
            "type": "prometheus",
            "uid": "$${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 16,
            "y": 6,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$${DS_PROMETHEUS}"
              },
              "expr": "DCGM_FI_DEV_GPU_TEMP",
              "legendFormat": "\u00b0C",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$${DS_PROMETHEUS}"
              },
              "expr": "DCGM_FI_DEV_POWER_USAGE",
              "legendFormat": "W",
              "refId": "B"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 9,
          "type": "row",
          "title": "LiteLLM (gateway)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 13,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Requests / min by model",
          "datasource": {
            "type": "prometheus",
            "uid": "$${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 0,
            "y": 14,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqpm"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$${DS_PROMETHEUS}"
              },
              "expr": "sum by (model) (rate(litellm_requests_metric_total[5m])) * 60",
              "legendFormat": "{{model}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Tokens / min by model",
          "datasource": {
            "type": "prometheus",
            "uid": "$${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 8,
            "y": 14,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$${DS_PROMETHEUS}"
              },
              "expr": "sum by (model) (rate(litellm_input_tokens_metric_total[5m])) * 60",
              "legendFormat": "in {{model}}",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$${DS_PROMETHEUS}"
              },
              "expr": "sum by (model) (rate(litellm_output_tokens_metric_total[5m])) * 60",
              "legendFormat": "out {{model}}",
              "refId": "B"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Failed requests / 15m",
          "datasource": {
            "type": "prometheus",
            "uid": "$${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 16,
            "y": 14,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$${DS_PROMETHEUS}"
              },
              "expr": "sum by (model) (increase(litellm_llm_api_failed_requests_metric_total[15m]))",
              "legendFormat": "{{model}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Time to first token p90",
          "datasource": {
            "type": "prometheus",
            "uid": "$${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 0,
            "y": 21,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$${DS_PROMETHEUS}"
              },
              "expr": "histogram_quantile(0.9, sum by (le, model) (rate(litellm_llm_api_time_to_first_token_metric_bucket[15m])))",
              "legendFormat": "{{model}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Total request latency p50 / p90",
          "datasource": {
            "type": "prometheus",
            "uid": "$${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 8,
            "y": 21,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$${DS_PROMETHEUS}"
              },
              "expr": "histogram_quantile(0.5, sum by (le, model) (rate(litellm_request_total_latency_metric_bucket[15m])))",
              "legendFormat": "p50 {{model}}",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$${DS_PROMETHEUS}"
              },
              "expr": "histogram_quantile(0.9, sum by (le, model) (rate(litellm_request_total_latency_metric_bucket[15m])))",
              "legendFormat": "p90 {{model}}",
              "refId": "B"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "Latency per output token p90",
          "datasource": {
            "type": "prometheus",
            "uid": "$${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 16,
            "y": 21,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$${DS_PROMETHEUS}"
              },
              "expr": "histogram_quantile(0.9, sum by (le, model) (rate(litellm_deployment_latency_per_output_token_bucket[15m])))",
              "legendFormat": "{{model}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 16,
          "type": "timeseries",
          "title": "In-flight requests",
          "datasource": {
            "type": "prometheus",
            "uid": "$${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 0,
            "y": 28,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$${DS_PROMETHEUS}"
              },
              "expr": "sum by (model) (litellm_in_flight_requests)",
              "legendFormat": "{{model}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 17,
          "type": "timeseries",
          "title": "Spend (cumulative, USD)",
          "datasource": {
            "type": "prometheus",
            "uid": "$${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 8,
            "y": 28,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$${DS_PROMETHEUS}"
              },
              "expr": "sum by (model) (litellm_spend_metric_total)",
              "legendFormat": "{{model}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 18,
          "type": "timeseries",
          "title": "Requests by status (24h)",
          "datasource": {
            "type": "prometheus",
            "uid": "$${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 16,
            "y": 28,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$${DS_PROMETHEUS}"
              },
              "expr": "sum by (model, status_code) (increase(litellm_proxy_total_requests_metric_total[24h]))",
              "legendFormat": "{{model}} {{status_code}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 19,
          "type": "row",
          "title": "Ollama (local inference)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 35,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 20,
          "type": "timeseries",
          "title": "Ollama CPU (cores)",
          "datasource": {
            "type": "prometheus",
            "uid": "$${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 0,
            "y": 36,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$${DS_PROMETHEUS}"
              },
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"ai\",pod=~\"ollama-.*\",container=\"app\"}[2m]))",
              "legendFormat": "cores",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 21,
          "type": "timeseries",
          "title": "Ollama memory",
          "datasource": {
            "type": "prometheus",
            "uid": "$${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 8,
            "y": 36,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$${DS_PROMETHEUS}"
              },
              "expr": "sum(container_memory_working_set_bytes{namespace=\"ai\",pod=~\"ollama-.*\",container=\"app\"})",
              "legendFormat": "working set",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 22,
          "type": "timeseries",
          "title": "Ollama request rate (via LiteLLM)",
          "datasource": {
            "type": "prometheus",
            "uid": "$${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 16,
            "y": 36,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqpm"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$${DS_PROMETHEUS}"
              },
              "expr": "sum by (model) (rate(litellm_requests_metric_total{model=~\"qwen.*|bge.*\"}[5m])) * 60",
              "legendFormat": "{{model}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        }
      ],
      "__inputs": [
        {
          "name": "DS_PROMETHEUS",
          "label": "Prometheus",
          "type": "datasource",
          "pluginId": "prometheus"
        }
      ],
      "templating": {
        "list": []
      }
    }
