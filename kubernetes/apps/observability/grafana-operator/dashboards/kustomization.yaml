---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
# One file per Grafana folder. A dashboard belongs here only if the thing it
# shows is actually deployed; remove it together with the app.
resources:
  - ./grafanadashboard.yaml # grafana-operator (inline)
  - ./kubernetes.yaml
  - ./flux.yaml
  - ./network.yaml
  - ./security.yaml
  - ./databases.yaml
  - ./observability.yaml
  - ./ai.yaml
