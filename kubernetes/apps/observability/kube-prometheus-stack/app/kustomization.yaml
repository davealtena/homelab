---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./alerts
  - ./alertmanagerconfig.yaml
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./scrapeconfig.yaml
configMapGenerator:
  - name: kube-prometheus-stack-ksm-flux-values
    files:
      - values.yaml=./resources/kube-state-metrics-flux.yaml
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
