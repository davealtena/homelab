---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kanidm
spec:
  targetNamespace: security
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: kopiur-repository
      namespace: system
    - name: kaniop
      namespace: security
    - name: cert-manager-issuers
      namespace: cert-manager
  components:
    - ../../../../components/kopiur/policy
  path: ./kubernetes/apps/security/kanidm/app
  prune: true
  postBuild:
    substitute:
      APP: kanidm
      KOPIUR_CLAIM: kanidm-data-kanidm-default-0
      KOPIUR_CAPACITY: 2Gi
      KOPIUR_MOVER_UID: "0"
      KOPIUR_MOVER_GID: "0"
      KOPIUR_SCHEDULE: "H * * * *"
      KOPIUR_KEEP_HOURLY: "24"
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 10m
