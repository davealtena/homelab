---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app paperless
spec:
  targetNamespace: selfhosted
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: dragonfly-operator
      namespace: databases
    - name: kopiur-repository
      namespace: system
    - name: external-secrets-stores
      namespace: security
    - name: kanidm
      namespace: security
  components:
    - ../../../../components/dragonfly
    - ../../../../components/kopiur/backup
  path: ./kubernetes/apps/selfhosted/paperless/app
  prune: true
  postBuild:
    substitute:
      APP: paperless
      KOPIUR_CLAIM: paperless-data
      KOPIUR_CAPACITY: 10Gi
      KOPIUR_MOVER_UID: "1000"
      KOPIUR_MOVER_GID: "100"
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
