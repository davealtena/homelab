---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-runner
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: forgejo-runner-secret
    creationPolicy: Owner
    template:
      data:
        # Shared-secret registration: `forgejo-cli actions register --secret <40 hex>`
        # on the server; uuid/token are derived from that secret (runner create-runner-file).
        uuid: "{{ .uuid }}"
        token: "{{ .token }}"
  dataFrom:
    - extract:
        key: forgejo-runner
