---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app actual-finance
spec:
  targetNamespace: selfhosted
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: kopiur-repository
      namespace: system
    - name: kanidm
      namespace: security
  components:
    - ../../../../components/kopiur/policy
  path: ./kubernetes/apps/selfhosted/actual-finance/app
  prune: true
  postBuild:
    substitute:
      APP: actual-finance
      KOPIUR_CLAIM: actual
      KOPIUR_CAPACITY: 10Gi
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
