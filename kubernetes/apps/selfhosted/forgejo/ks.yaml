---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app forgejo
spec:
  targetNamespace: selfhosted
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: kopiur-repository
      namespace: system
    - name: external-secrets-stores
      namespace: security
    - name: cnpg-cluster
      namespace: databases
    - name: kanidm
      namespace: security
  components:
    - ../../../../components/kopiur/backup
  path: ./kubernetes/apps/selfhosted/forgejo/app
  prune: true
  postBuild:
    substitute:
      APP: forgejo
      KOPIUR_CLAIM: forgejo
      KOPIUR_CAPACITY: 20Gi
      KOPIUR_MOVER_UID: "1000"
      KOPIUR_MOVER_GID: "1000"
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
