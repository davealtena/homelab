---
# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
# Based on recyclarr/config-templates sonarr/templates/web-1080p.yml and
# radarr/templates/hd-bluray-web.yml. Deviation: x265 (HD) is allowed at 1080p
# (public indexers mostly carry x265); only x265 without HDR/DV at 2160p is blocked.
sonarr:
  sonarr_main:
    base_url: http://sonarr.downloads.svc.cluster.local:8989
    api_key: !env_var SONARR_API_KEY
    delete_old_custom_formats: true
    quality_definition:
      type: series
    media_naming:
      series: plex-tvdb
      season: default
      episodes:
        rename: true
        standard: default
        daily: default
        anime: default
    media_management:
      propers_and_repacks: do_not_prefer
    quality_profiles:
      - trash_id: 72dae194fc92bf828f32cde7744e51a1 # WEB-1080p
        reset_unmatched_scores:
          enabled: true
    custom_format_groups:
      add:
        - trash_id: 158188097a58d7687dee647e04af0da3 # [Optional] Golden Rule HD
          exclude:
            - 47435ece6b99a0b477caf360e79ba0bb # x265 (HD)
          select:
            - 9b64dff695c2115facf1b6ea59c9bd07 # x265 (no HDR/DV)
        - trash_id: 85fae4a2294965b75710ef2989c850eb # [Streaming Services] HD/UHD boost
        - trash_id: 59c3af66780d08332fdc64e68297098f # [Unwanted] Unwanted Formats
          select:
            - 82d40da2bc6923f41e14394075dd4b03 # No-RlsGroup
            - e1a997ddb54e3ecbfe06341ad323c458 # Obfuscated
            - 06d66ab109d4d2eddb2794d21526d140 # Retags

radarr:
  radarr_main:
    base_url: http://radarr.downloads.svc.cluster.local:7878
    api_key: !env_var RADARR_API_KEY
    delete_old_custom_formats: true
    quality_definition:
      type: movie
    media_naming:
      folder: plex-imdb
      movie:
        rename: true
        standard: plex-imdb
    media_management:
      propers_and_repacks: do_not_prefer
    quality_profiles:
      - trash_id: d1d67249d3890e49bc12e275d989a7e9 # HD Bluray + WEB
        reset_unmatched_scores:
          enabled: true
    custom_format_groups:
      add:
        - trash_id: f8bf8eab4617f12dfdbd16303d8da245 # [Optional] Golden Rule HD
          exclude:
            - dc98083864ea246d05a42df0d05f81cc # x265 (HD)
          select:
            - 839bea857ed2c0a8e084f3cbdbd65ecb # x265 (no HDR/DV)
        - trash_id: a3ac6af01d78e4f21fcb75f601ac96df # [Unwanted] Unwanted Formats
          select:
            - ae9b7c9ebde1f3bd336a8cbd1ec4c5e5 # No-RlsGroup
            - 7357cf5161efbf8c4d5d0c30b4815ee2 # Obfuscated
            - 5c44f52a8714fdd79bb4d98e2673be1f # Retags
