# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# One kopiur-nas-secret per namespace that runs kopiur movers (mover pods read it via envFrom).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./system.yaml
  - ./downloads.yaml
  - ./media.yaml
  - ./databases.yaml
  - ./ai.yaml
  - ./security.yaml
  - ./observability.yaml
