---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Tofu Validate

on:
  pull_request:
    branches: ["main"]
    paths: ["infrastructure/**", ".mise.toml"]

jobs:
  validate:
    name: fmt + validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: https://github.com/jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: opentofu

      # Same check as `mise run tofu:fmt`; needs no credentials.
      - name: Format + validate
        run: mise run tofu:fmt
