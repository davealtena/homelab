---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Tofu Validate

on:
  pull_request:
    branches: ["main"]
    paths: ["infrastructure/**", ".mise.toml"]

jobs:
  validate:
    name: fmt + validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: https://github.com/jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: opentofu

      # Same check as `mise run tofu:fmt`; needs no credentials.
      - name: Format + validate
        run: mise run tofu:fmt
