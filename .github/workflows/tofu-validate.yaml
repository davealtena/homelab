---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Tofu Validate

on:
  pull_request:
    branches: ["main"]
    paths: ["infrastructure/**", ".mise.toml"]

permissions:
  contents: read

jobs:
  validate:
    name: fmt + validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: opentofu

      # Same check as `mise run tofu:fmt`; needs no credentials.
      - name: Format + validate
        run: mise run tofu:fmt
